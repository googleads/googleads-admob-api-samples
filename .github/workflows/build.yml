name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'python/v1/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'python/v1/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build-python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'python/v1/requirements.txt'

      - name: Install dependencies
        working-directory: python/v1
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        working-directory: python/v1
        run: python -m py_compile *.py

      - name: Verify module imports
        working-directory: python/v1
        run: python -c "import admob_utils, get_account, list_accounts, list_apps, list_ad_units, generate_network_report, generate_mediation_report, generate_campaign_report"
